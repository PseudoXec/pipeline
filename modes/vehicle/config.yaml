# Vehicle mode: vehicle detect → crop → plate detect → crop → send metadata.
# Everything here is used by vehicle mode only.
# Relative paths are relative to this folder (modes/vehicle/). Machine-specific overrides: config.local.yaml.

model:
  vehicle_weights: "models/vehicle.onnx"
  plate_weights: "models/platenum_closeup.onnx"
  vehicle_imgsz: [512, 896] # [height, width] - must match vehicle.onnx's static shape
  plate_imgsz: 640 # must match platenum_closeup.onnx's static shape
  vehicle_conf_threshold: 0.40
  plate_conf_threshold: 0.35
  vehicle_classes: null # e.g. "car,truck,bus,motorcycle"; null = accept all
  agnostic_nms: true # one box per vehicle even when the model flips between classes

roi: # what counts as inside the zone (the polygon itself is in camera/config.yaml)
  crop_margin: 0.05

crop:
  vehicle_padding_ratio: 0.08
  vehicle_min_crop_height: 200
  plate_min_crop_height: 160
  plate_padding_pixels: 4
  plate_padding_ratio: 0.12

images:
  jpeg_quality: 90
  plate_jpeg_quality: 96

features:
  roi_filter: true
  roi_crop_detect: true
  plate_detection: true
  save_images_to_disk: true
  print_console: true
  send_via_api: true # needs api.vehicle_endpoint_url and switches.api
  delete_row_after_api_send: true

# One event per vehicle instead of one per frame (ByteTrack-style tracker, core/tracker.py).
tracking:
  min_hits: 2 # a vehicle must be seen this many times before it counts
  track_ttl_seconds: 2.0 # not seen for this long -> the track ends and its best result is stored
  match_iou: 0.30 # min overlap to treat a box as the same vehicle as last frame
  low_conf: 0.15 # model runs this low so weak boxes can keep a track alive (they never start one)
  low_match_iou: 0.50
  max_attempts: 3 # plate-detection tries per vehicle; the best plate is kept
  retry_interval_seconds: 0.3 # gap between two tries on the same vehicle
  accept_score: 0.60 # stop trying early once a plate is at least this confident
