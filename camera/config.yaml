# Camera settings. Machine-specific values (the RTSP password!) can go in camera/config.local.yaml,
# which is merged on top of this file and ignored by git.
camera:
  source_mode: "static" # "static" | "api"
  rtsp_url: "rtsp://admin:Victoria2313*@192.168.100.224:554/Streaming/Channels/101" # RTSP URL of the camera. Use the camera's IP address in place of CAMERA_IP.
  frame_width: 3840
  frame_height: 2160
  capture_buffer_size: 1
  decode_threads: 2
  max_fps: 20
  reconnect_delay_seconds: 5.0
  max_reconnect_attempts: 0 # 0 = retry forever
  isapi_enabled: true
  isapi_port: 80
  isapi_https: false
  isapi_channel_id: 1 # channel whose name is used as the camera name
  # isapi_username / isapi_password: only needed if different from rtsp_url's own login

# The ROI polygon (normalised 0..1). The command center can overwrite it at runtime (api/config.yaml).
roi:
  polygon:
    - [0.20, 0.20]
    - [0.80, 0.20]
    - [0.80, 0.80]
    - [0.20, 0.80]
