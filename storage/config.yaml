# Detection buffer: records wait in an in-memory queue (max 500) and are sent over the WebSocket by a background
# thread. Nothing is written to a database; unsent records are lost on restart. Per-mode options (JPEG quality,
# whether to send, which events to keep) are in modes/<mode>/config.yaml.
storage:
  output_dir: "output"   # only used when save_images_to_disk is on (spot-check JPEG copies)
